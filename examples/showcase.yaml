title: Murmura showcase
drones: 120

limits:
  max_velocity_xy: 7
  max_velocity_z: 2.5
  max_velocity_z_up: 2
  max_acceleration: 3
  min_distance: 2.5
  max_altitude: 120

home:
  grid: {spacing: 3, columns: 12}

auto_scale: true

takeoff:
  altitude: 6
  color: "#202020"

scenes:
  - name: Logo
    formation: {shape: svg, file: logo.svg, size: 60, center: [0, 0, 45]}
    hold: 10
    lights: formation

  - name: Hello
    formation: {shape: text, text: "МИР", height: 20, center: [0, 0, 40]}
    hold: 8
    lights: {effect: gradient, colors: ["#ff4081", "#ffd740"], axis: x}

  - name: Galaxy
    formation: {shape: disc, radius: 22, center: [0, 0, 40], plane: xy}
    hold: 14
    lights: {effect: rainbow, period: 6, axis: radial, spread: 1.5}
    motion: {kind: rotate, rpm: 2}

  - name: Ocean
    formation: {shape: rectangle, width: 50, height: 22, filled: true, center: [0, 0, 40]}
    hold: 12
    lights: {effect: wave, colors: ["#00e5ff", "#1a237e"], axis: x, speed: 8, wavelength: 20}
    motion: {kind: wave, amplitude: 1.5, wavelength: 20, period: 5}

landing:
  velocity: 1.2
  spindown: 3
