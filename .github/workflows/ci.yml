name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests examples blender
          ruff format --check src tests examples blender
      - name: Test
        run: pytest
      - name: Build and validate the demo show
        run: |
          murmura demo -o demo.skyc
          murmura validate demo.skyc

  blender-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the add-on package
        run: python blender/build_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: murmura-blender
          path: dist/murmura-blender-*.zip
